{{ define "main" }}

<section class="page">

  <h1>{{ .Title }}</h1>

  <div class="photo-gallery" id="photo-gallery">

    {{ range (os.ReadDir "static/images/gallery2") }}

      {{ $ext := lower (path.Ext .Name) }}

      {{ if in (slice ".jpg" ".jpeg" ".png" ".webp") $ext }}

        <img src="/images/gallery2/{{ .Name }}" loading="lazy">

      {{ end }}

    {{ end }}

  </div>

</section>

<style>

.page {

  max-width: 1600px;

  width: calc(100% - 40px);

  margin: 0 auto;

}

.photo-gallery {

  display: grid;

  grid-template-columns: repeat(8, 1fr);

  grid-auto-rows: 100px;

  grid-auto-flow: dense;

  gap: 2px;

}

.photo-gallery img {

  width: 100%;

  height: 100%;

  object-fit: contain;

  display: block;

}

/* Large square images */

.photo-gallery img:nth-child(7n + 1) {

  grid-column: span 2;

  grid-row: span 2;

}

/* Wide images */

.photo-gallery img:nth-child(11n + 3) {

  grid-column: span 2;

}

/* Tall images */

.photo-gallery img:nth-child(13n + 5) {

  grid-row: span 2;

}

/* Medium screens */

@media (max-width: 1200px) {

  .photo-gallery {

    grid-template-columns: repeat(6, 1fr);

    grid-auto-rows: 100px;

  }

}

/* Tablets */

@media (max-width: 900px) {

  .photo-gallery {

    grid-template-columns: repeat(4, 1fr);

    grid-auto-rows: 110px;

  }

}

/* Phones */

@media (max-width: 600px) {

  .page {

    width: calc(100% - 20px);

  }

  .photo-gallery {

    grid-template-columns: repeat(3, 1fr);

    grid-auto-rows: 100px;

    gap: 1px;

  }

}

</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const gallery = document.getElementById("photo-gallery");
  const images = Array.from(gallery.children);

  for (let i = images.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [images[i], images[j]] = [images[j], images[i]];
  }

  images.forEach(image => gallery.appendChild(image));
});
</script>

{{ end }}
